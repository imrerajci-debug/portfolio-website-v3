<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="heatHot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8394A" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#F2812E" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#F6C453" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F6C453" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatMed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2812E" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#F6C453" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F6C453" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatLow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6C453" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F6C453" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>
  <line x1="800" y1="30" x2="800" y2="970" stroke="#5C4432" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ============ LEFT: HEATMAP — real page copy from goldbachregional.ch ============ -->
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5C4432" opacity="0.45" letter-spacing="0.14em">HEATMAP — KMU-LÖSUNGEN OVERVIEW PAGE</text>
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="700" height="640" rx="6" fill="#FAFAFA" stroke="#5C4432" stroke-opacity="0.1"/>
    <g font-family="Arial, Helvetica, sans-serif" fill="#2B2B2B">
      <!-- heading -->
      <text x="24" y="52" font-size="27" font-weight="800">KMU-Lösungen: nachhaltiger</text>
      <text x="24" y="86" font-size="27" font-weight="800">Werbeerfolg für Schweizer KMU</text>
      <!-- paragraph -->
      <g font-size="13" fill="#4A4A4A">
        <text x="24" y="122">Hier erhältst du für dein KMU massgeschneiderte Werbelösungen – von Online über Print bis</text>
        <text x="24" y="142">hin zu Social Media, TV und Video. Persönliche Beratung, ein vielfältiges Medienportfolio,</text>
        <text x="24" y="162">eine unkomplizierte Buchung sowie ein Live-Reporting ermöglichen dauerhaften Erfolg.</text>
      </g>
      <!-- CTA -->
      <rect x="24" y="188" width="196" height="44" rx="4" fill="#E8394A"/>
      <text x="122" y="215" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Kontaktiere uns jetzt</text>
      <!-- benefits heading -->
      <text x="24" y="286" font-size="17" font-weight="800">So profitierst du von Goldbach Regional</text>
      <!-- checklist: 3 left, 2 right -->
      <g font-size="12.5" fill="#3A3A3A">
        <circle cx="36" cy="326" r="11" fill="none" stroke="#E8394A" stroke-width="1.6"/>
        <path d="M31,326 l4,4 l7,-8" fill="none" stroke="#E8394A" stroke-width="1.6"/>
        <text x="56" y="322">Persönliche Beratung für die</text>
        <text x="56" y="338">gewünschten Werbeauslieferung</text>

        <circle cx="36" cy="376" r="11" fill="none" stroke="#E8394A" stroke-width="1.6"/>
        <path d="M31,376 l4,4 l7,-8" fill="none" stroke="#E8394A" stroke-width="1.6"/>
        <text x="56" y="380">Einzigartiges Medienportfolio</text>

        <circle cx="36" cy="418" r="11" fill="none" stroke="#E8394A" stroke-width="1.6"/>
        <path d="M31,418 l4,4 l7,-8" fill="none" stroke="#E8394A" stroke-width="1.6"/>
        <text x="56" y="414">Volle Transparenz und Kontrolle</text>
        <text x="56" y="430">dank Live Reporting je Kampagne</text>

        <circle cx="376" cy="326" r="11" fill="none" stroke="#E8394A" stroke-width="1.6"/>
        <path d="M371,326 l4,4 l7,-8" fill="none" stroke="#E8394A" stroke-width="1.6"/>
        <text x="396" y="322">Viele Targeting-Möglichkeiten für</text>
        <text x="396" y="338">optimale Zielgruppenansprache</text>

        <circle cx="376" cy="376" r="11" fill="none" stroke="#E8394A" stroke-width="1.6"/>
        <path d="M371,376 l4,4 l7,-8" fill="none" stroke="#E8394A" stroke-width="1.6"/>
        <text x="396" y="372">Alle Werbekampagnen regional</text>
        <text x="396" y="388">auf deine Region abgestimmt</text>
      </g>
    </g>

    <!-- heat overlay, drawn last -->
    <circle cx="122" cy="210" r="140" fill="url(#heatHot)"/>
    <circle cx="60" cy="330" r="95" fill="url(#heatHot)"/>
    <circle cx="60" cy="418" r="85" fill="url(#heatMed)"/>
    <circle cx="60" cy="376" r="75" fill="url(#heatMed)"/>
    <circle cx="400" cy="330" r="80" fill="url(#heatMed)"/>
    <circle cx="400" cy="376" r="70" fill="url(#heatLow)"/>
    <circle cx="220" cy="60" r="90" fill="url(#heatLow)"/>
  </g>
  <text x="60" y="748" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5C4432" opacity="0.4" font-style="italic">Warmest zones: the CTA button and the first two proof points readers reach first.</text>

  <!-- ============ RIGHT: WIREFRAME — same page, revised structure ============ -->
  <text x="840" y="46" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5C4432" opacity="0.45" letter-spacing="0.14em">WIREFRAME — REVISED STRUCTURE</text>
  <g transform="translate(840,70)" fill="none" stroke="#5C4432" stroke-width="1.4" opacity="0.65">
    <rect x="0" y="0" width="700" height="640" rx="6" opacity="0.3"/>
    <!-- heading -->
    <rect x="24" y="26" width="560" height="24" rx="3"/>
    <rect x="24" y="58" width="420" height="24" rx="3"/>
    <!-- paragraph -->
    <line x1="24" y1="108" x2="670" y2="108"/>
    <line x1="24" y1="128" x2="650" y2="128"/>
    <line x1="24" y1="148" x2="600" y2="148"/>
    <!-- CTA -->
    <rect x="24" y="176" width="196" height="44" rx="4"/>
    <!-- benefits heading -->
    <rect x="24" y="272" width="330" height="20" rx="3"/>
    <!-- checklist 3 left, 2 right -->
    <circle cx="36" cy="326" r="11"/>
    <line x1="56" y1="318" x2="230" y2="318"/>
    <line x1="56" y1="334" x2="200" y2="334"/>
    <circle cx="36" cy="376" r="11"/>
    <line x1="56" y1="376" x2="200" y2="376"/>
    <circle cx="36" cy="418" r="11"/>
    <line x1="56" y1="410" x2="230" y2="410"/>
    <line x1="56" y1="426" x2="210" y2="426"/>
    <circle cx="376" cy="326" r="11"/>
    <line x1="396" y1="318" x2="570" y2="318"/>
    <line x1="396" y1="334" x2="540" y2="334"/>
    <circle cx="376" cy="376" r="11"/>
    <line x1="396" y1="368" x2="560" y2="368"/>
    <line x1="396" y1="384" x2="530" y2="384"/>
  </g>
  <text x="840" y="748" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5C4432" opacity="0.4" font-style="italic">Same information, restructured for scanability before any visual design.</text>
</svg>
