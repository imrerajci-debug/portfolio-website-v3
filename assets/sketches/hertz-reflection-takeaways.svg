<svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="900" fill="#FFFFFF"/>

  <text x="60" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5C4432" opacity="0.45" letter-spacing="0.16em">KEY TAKEAWAYS</text>

  <line x1="94" y1="150" x2="94" y2="770" stroke="#5C4432" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- Row 1: a journey is only as strong as its data -->
  <g>
    <circle cx="94" cy="150" r="38" fill="#91D2C0"/>
    <g transform="translate(94,150)" stroke="#3F2D20" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-4,-6 a6,6 0 0 1 8,-8 l4,-4 a6,6 0 0 1 8,8 l-4,4"/>
      <path d="M4,6 a6,6 0 0 1 -8,8 l-4,4 a6,6 0 0 1 -8,-8 l4,-4"/>
      <line x1="-4" y1="4" x2="4" y2="-4"/>
    </g>
    <text x="150" y="130" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#3F2D20">A journey is only as</text>
    <text x="150" y="160" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#3F2D20">strong as its data</text>
    <text x="150" y="192" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#4A4A4A">The customer journey depended closely on</text>
    <text x="150" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#4A4A4A">the vehicle information structure behind it.</text>
  </g>

  <!-- Row 2: agree the structure early -->
  <g>
    <circle cx="94" cy="410" r="38" fill="#FCE795"/>
    <g transform="translate(94,410)" stroke="#3F2D20" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-14,-18 h20 l8,8 v28 h-28 z"/>
      <path d="M6,-18 v8 h8"/>
      <path d="M-8,0 h16 M-8,8 h16 M-8,16 h10"/>
    </g>
    <text x="150" y="390" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#3F2D20">Agree the structure</text>
    <text x="150" y="420" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#3F2D20">before the screens</text>
    <text x="150" y="452" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#4A4A4A">Agreeing the vehicle structure early connected</text>
    <text x="150" y="474" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#4A4A4A">browsing, comparison and sales enquiries.</text>
  </g>

  <!-- Row 3: grounded in needs and delivery together -->
  <g>
    <circle cx="94" cy="670" r="38" fill="#96C9EC"/>
    <g transform="translate(94,670)" stroke="#3F2D20" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-9" cy="-6" r="7"/>
      <path d="M-20,14 C-20,2 -1,2 -1,14"/>
      <circle cx="11" cy="-4" r="6"/>
      <path d="M1,15 C1,4 21,4 21,15"/>
    </g>
    <text x="150" y="650" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#3F2D20">Ground decisions in</text>
    <text x="150" y="680" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#3F2D20">needs and delivery</text>
    <text x="150" y="712" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#4A4A4A">Working with another designer, developers and</text>
    <text x="150" y="734" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#4A4A4A">stakeholders kept choices realistic and shared.</text>
  </g>

  <line x1="60" y1="820" x2="740" y2="820" stroke="#5C4432" stroke-opacity="0.12" stroke-width="1"/>
  <text x="60" y="856" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5C4432" opacity="0.4" font-style="italic">Hertz MiniLease — lessons carried into every project since.</text>
</svg>
